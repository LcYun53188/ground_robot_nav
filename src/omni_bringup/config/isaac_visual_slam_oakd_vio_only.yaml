visual_slam:
  ros__parameters:
    use_sim_time: false

    # Continuous-odometry profile for OAK-D validation and early navigation.
    #
    # This disables the SLAM/localization layer and keeps only stereo VIO. It is
    # useful when /visual_slam/tracking/odometry must be continuous and any
    # map/pose-graph correction would be interpreted as an odometry jump.
    # Keep RViz Fixed Frame on "odom" when using this profile.
    num_cameras: 2
    min_num_images: 2
    tracking_mode: 1
    rectified_images: true
    sync_matching_threshold_ms: 8.0
    image_jitter_threshold_ms: 80.0
    imu_jitter_threshold_ms: 20.0

    map_frame: map
    odom_frame: odom
    base_frame: base_link
    imu_frame: oakd_imu_link
    camera_optical_frames:
      - oakd_left_camera_optical_frame
      - oakd_right_camera_optical_frame

    publish_map_to_odom_tf: false
    publish_odom_to_base_tf: true
    enable_localization_n_mapping: false

    enable_ground_constraint_in_odometry: false
    enable_ground_constraint_in_slam: false

    image_qos: SENSOR_DATA
    imu_qos: SENSOR_DATA
    image_buffer_size: 100
    imu_buffer_size: 200
    calibration_frequency: 250.0

    enable_slam_visualization: false
    enable_observations_view: false
    enable_landmarks_view: false
    verbosity: 1
