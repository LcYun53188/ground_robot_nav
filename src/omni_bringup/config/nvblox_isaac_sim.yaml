nvblox_node:
  ros__parameters:
    use_sim_time: true

    # cuVSLAM publishes odom->base_link. nvblox integrates depth in odom so Nav2
    # can consume a local rolling ESDF/costmap without wheel odometry.
    global_frame: odom
    pose_frame: base_link
    use_tf_transforms: true
    use_topic_transforms: false

    mapping_type: static_tsdf
    use_depth: true
    use_color: false
    voxel_size: 0.035
    esdf_mode: 2d
    publish_esdf_distance_slice: true
    publish_map_slice: true
    occupancy_grid_visualization_z_offset_m: -0.20
    publish_mesh: true

    # Preserve every integrated static TSDF block for full-session map export.
    # Nav2 costmaps remain rolling windows; only the underlying nvblox map is
    # made cumulative. Memory usage therefore grows with the explored area.
    decay_tsdf_rate_hz: 0.0
    map_clearing_radius_m: -1.0

    # Follow the locally observed ground plane so a ramp does not intersect a
    # fixed odom-Z obstacle slice and appear as a wall to Nav2.
    multi_mapper:
      experimental_use_ground_plane_estimation: true
      max_ground_plane_slope_deg: 30.0
      # Reject nearly horizontal undersides while the elevation-continuity
      # fallback handles noisy reversed normals on shallow ramps.
      min_reversed_traversable_slope_deg: 5.0
      # Slightly exceed one 3.5 cm voxel so adjacent ramp columns remain a
      # continuous elevation surface instead of alternating obstacle cells.
      traversable_elevation_height_tolerance_m: 0.04
      ground_points_candidates_min_z_m: -0.20
      ground_points_candidates_max_z_m: 0.35
      ransac_distance_threshold_m: 0.05
      num_ransac_iterations: 300

    # Keep the fixed-Z values as fallback, but use a plane-relative slice when
    # ground estimation is available. The slice starts above the ground and
    # covers the simulated robot's 0.36 m vertical envelope.
    static_mapper:
      esdf_slice_height: 0.12
      esdf_slice_min_height: 0.03
      esdf_slice_max_height: 0.36
      slice_height_above_plane_m: 0.03
      slice_height_thickness_m: 0.33

    maximum_sensor_message_queue_length: 10
    back_projection_subsampling: 1
    depth_qos: sensor_data
    color_qos: sensor_data
