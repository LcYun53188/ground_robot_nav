# Isaac Sim navigation simulation configuration.
#
# The runner reads this file before Isaac Sim starts. Keep paths configurable
# because Isaac Sim is not installed in a fixed location on this workstation.
isaac_sim:
  # This workspace targets Isaac Sim 4.5 for local UI/RTX testing because the
  # RTX 4070 Laptop 8 GB GPU does not meet Isaac Sim 5.1's VRAM check.
  target_version: "4.5"

  # "ros_bridge_only" is the lightweight smoke-test path: it publishes /clock,
  # TF, odometry, and synthetic RGB-D from ROS only, so it does not require
  # Isaac Kit to start. Use "isaac" for real Isaac-rendered RGB-D once the local
  # Isaac Sim installation can launch reliably.
  launch_mode: "ros_bridge_only"

  # Preferred: set ISAAC_SIM_PYTHON or put the absolute path here. This
  # workstation uses the Isaac Sim 4.5 pip environment managed by uv.
  python_executable: "/home/nuc/Program/ground_robot_nav_ws/.venv-isaac-sim-4.5/bin/python"

  # Optional: path to the Isaac Sim app launcher when you want to launch the UI.
  app_executable: "/home/nuc/Program/ground_robot_nav_ws/.venv-isaac-sim-4.5/bin/isaacsim"
  headless: true
  renderer: "RaytracedLighting"
  anti_aliasing: 0
  samples_per_pixel_per_frame: 1
  multi_gpu: false
  max_gpu_count: 1
  disable_viewport_updates: true
  enable_crashreporter: false

ros:
  domain_id: 0
  use_sim_time: true
  # Isaac Sim and ROS Jazzy can use incompatible Python/rclpy ABIs. Keep ROS
  # topic publication in the external ROS bridge process.
  use_internal_python_bridge: false
  start_external_ros_bridge: true
  # When oakd.render_mode is "isaac", the external ROS bridge connects to the
  # Isaac process over localhost TCP. The bridge sends the current robot pose to
  # Isaac Sim, and Isaac Sim returns rendered RGB-D frames for ROS publication.
  frame_server_host: "127.0.0.1"
  frame_server_port: 47650
  frame_server_timeout_sec: 0.10

scene:
  stage_units_in_meters: 1.0
  ground_size_m: 12.0
  ground_thickness_m: 0.05
  obstacle_count: 4

  # Optional STL/USD import hooks. Leave empty to use built-in primitive geometry.
  robot_mesh_stl_path: ""
  scene_mesh_stl_path: ""
  world_usd_path: ""

robot:
  prim_path: "/World/GroundRobot"
  base_frame: "base_link"
  odom_frame: "odom"
  initial_pose:
    x: 0.0
    y: 0.0
    z: 0.08
    yaw: 0.0
  dimensions:
    # Its diameter and height are 4/5 of the original 0.45 m short side
    # and 0.20 m height, respectively.
    radius_m: 0.18
    height_m: 0.16
  max_linear_speed_mps: 0.6
  max_angular_speed_radps: 1.0
  cmd_vel_topic: "/cmd_vel"
  odometry_topic: "/visual_slam/tracking/odometry"

oakd:
  prim_path: "/World/GroundRobot/OAKD"
  imu_frame: "oakd_imu_link"
  optical_frame: "oakd_camera_optical_frame"
  left_frame: "oakd_left_camera_optical_frame"
  right_frame: "oakd_right_camera_optical_frame"
  pose:
    x: 0.12
    y: 0.0
    z: 0.28
    roll: 0.0
    pitch: 0.0
    yaw: 0.0
  stereo_baseline_m: 0.075
  # "isaac" publishes rendered RGB-D frames from the Isaac stage. "pattern"
  # keeps the synthetic fixed-pattern smoke test and is the default lightweight
  # mode for hosts where Isaac Kit cannot initialize.
  render_mode: "pattern"
  camera_focal_length_mm: 2.4
  camera_horizontal_aperture_mm: 3.6
  near_clip_m: 0.05
  far_clip_m: 8.0
  resolution:
    # Keep default RGB-D rendering light enough for headless validation.
    width: 320
    height: 240
  frequency_hz: 30
  left_image_topic: "/oakd/left/image_raw"
  right_image_topic: "/oakd/right/image_raw"
  left_camera_info_topic: "/oakd/left/camera_info"
  right_camera_info_topic: "/oakd/right/camera_info"
  depth_image_topic: "/oakd/depth/image"
  depth_camera_info_topic: "/oakd/depth/camera_info"
